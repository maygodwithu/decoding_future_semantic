[project]
name = "paper-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "openai>=1.0",
    "claude-agent-sdk",
]

[project.scripts]
paper-agent = "paper_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["paper_agent*"]
